<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDo List</title>

    <!--  Add the boostrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .text-strikethrough{
            text-decoration:line-through;
            color:Red;
            font-weight:bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="mt-5 text-center" style="font-weight:500">ToDo Application</h1>

        <form action="/" method="post" class="row mt-3">
            <div class="col-md-10">
                <input type="text" name="title" placeholder="add task.." required class="form-control form-control-lg">
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary btn-lg btn-block">+ Add Task</button>
            </div>
        </form>

        <div class="mt-4">
            <!--    Iterate the all tasks    -->
            <th:block th:each="task : ${tasks}">
                <div class="card mb-2">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span th:classappend="${task.completed} ? 'text-strikethrough'" th:text="${task.title}">Task Title</span>

                        <div>
                            <a th:href="@{/{id}/completed(id=${task.id})}" class="btn btn-success">Complete the Task</a>
                            <a th:href="@{/{id}/delete(id=${task.id})}" class="btn btn-danger">Delete</a>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

    </div>

</body>
</html>
